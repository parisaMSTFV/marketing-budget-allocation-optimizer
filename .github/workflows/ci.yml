name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke-test supplied weekly response path
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: >-
          python -m marketing_allocation
          --input-weekly-response data/sample/weekly_response_fixture.csv
          --budget 1200000
          --test-weeks 6
          --validation-weeks 5
          --project-root /tmp/marketing-allocation-input-smoke
      - name: Check public files
        run: python scripts/check_sensitive.py
